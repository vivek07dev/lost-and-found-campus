<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lost & Found Campus</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        nav {
            background: #1e3a8a;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 45px;
            color: #1e3a8a;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }

        .lost {
            background: #dc2626;
        }

        .found {
            background: #16a34a;
        }

        .view {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Lost & Found Campus</h2>

        <div>
            <a href="/">Home</a>
            <a href="/lost-items">Lost Items</a>
            <a href="/found-items">Found Items</a>
        </div>
    </nav>

    <div class="hero">

        <h1>Lost Something?</h1>

        <p>
            Find your lost items or report something you found on campus.
        </p>

        <!-- Report Lost -->
        <a href="/lost">
            <button class="lost">Report Lost Item</button>
        </a>

        <!-- Report Found -->
        <a href="/found">
            <button class="found">Report Found Item</button>
        </a>

        <br>

        <!-- View Lost -->
        <a href="/lost-items">
            <button class="view">View Lost Items</button>
        </a>

        <!-- View Found -->
        <a href="/found-items">
            <button class="view">View Found Items</button>
        </a>

        <div style="margin-top: 40px;">

            <h2>Search Items</h2>

           <form action="/search" method="GET">

    <input
        type="text"
        name="q"
        placeholder="Search lost or found item..."
        style="padding: 12px; width: 300px; border: 1px solid #ccc; border-radius: 6px;"
        required
    >

    <button type="submit" class="view">Search</button>

</form>

            <a href="/lost">
                <button class="lost">Report Lost Item</button>
            </a>

            <a href="/found">
                <button class="found">Report Found Item</button>
            </a>

        </div>

    </div>

</body>
</html
