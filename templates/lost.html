<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f9ff;
            color: #183153;
        }

        header {
            background: #102a43;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #2196f3;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            color: #102a43;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #627d98;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-top: 5px solid #1976d2;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #243b53;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #1976d2;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #125ca1;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 60px;
            background: #102a43;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Lost & Found <span>Campus</span>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/lost-items">Lost Items</a>
        <a href="/found-items">Found Items</a>
    </nav>
</header>

<div class="container">

    <h1>📋 Report Lost Item</h1>

    <p class="subtitle">
        Enter the details of the item you lost
    </p>

    <div class="form-card">

        <form action="/submit-lost" method="POST">

            <label>Item Name</label>
            <input type="text" name="item_name" required>

            <label>Category</label>
            <input type="text" name="category" required>

            <label>Lost Location</label>
            <input type="text" name="location" required>

            <label>Date</label>
            <input type="date" name="date" required>

            <label>Description</label>
            <textarea name="description" required></textarea>

            <label>Contact Number</label>
            <input type="tel" name="contact" required>

            <button type="submit">
                Submit Lost Item
            </button>

        </form>

        <a class="back" href="/">
            ← Back to Home
        </a>

    </div>

</div>

<footer>
    Lost & Found Campus
    <br>
    Together we keep our campus safer
</footer>

</body>
</html>
